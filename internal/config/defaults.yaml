# hm built-in defaults. Your ~/.config/hm/config.yaml and a project's
# .hm/config.yaml use the same keys; later files win. Maps merge key by key,
# lists replace.

editor:
  theme: tokyo-night          # any theme name, or "system"
  font_size: 14
  font_family: ""             # empty = built-in monospace
  tab_width: 4
  insert_spaces: false
  soft_wrap: false
  line_numbers: true
  format_on_save: true
  auto_save: off              # off | focus_change | delay
  auto_save_delay: 1s
  show_hidden: true           # show dotfiles in the explorer

keys:                         # command id -> chord; overrides built-ins
  palette: cmd+shift+p
  search.project: cmd+f
  editor.find: cmd+alt+f
  editor.replace: cmd+alt+h
  file.quickOpen: cmd+p
  file.openFolder: cmd+o
  file.newFile: cmd+n
  file.save: cmd+s
  file.saveAll: cmd+alt+s
  file.close: cmd+w
  view.sidebar: cmd+b
  view.theme: cmd+k
  view.tabs: cmd+shift+e
  panel.terminal: ctrl+`
  panel.git: cmd+shift+g
  panel.problems: cmd+shift+m
  agent.toggle: cmd+l
  editor.definition: f12
  editor.references: shift+f12
  editor.rename: f2
  editor.format: shift+alt+f
  editor.symbols: cmd+shift+o
  app.settings: cmd+,

search:
  engine: auto                # auto | ripgrep | builtin
  exclude: [node_modules, vendor, .git, dist]
  max_results: 5000

languages:
  # Each language maps extensions to a grammar, a language server and
  # formatters. "on" picks when a formatter runs: save, manual, paste.
  # {file} is the file being formatted; stdin: true pipes the buffer in and
  # takes stdout back. With no formatters, the server's formatting is used.
  go:
    extensions: [.go]
    lsp:
      command: gopls
      args: [serve]
      root_markers: [go.work, go.mod]
      install:
        - { tool: go, args: [install, golang.org/x/tools/gopls@latest] }
        - { tool: brew, args: [install, gopls] }
    formatters:
      - { command: gofmt, args: ["-w", "{file}"], on: [save, manual] }
  typescript:
    extensions: [.ts, .tsx, .mts, .cts]
    language_ids: { .tsx: typescriptreact }
    lsp:
      command: typescript-language-server
      args: [--stdio]
      root_markers: [tsconfig.json, package.json]
      install:
        - { tool: npm, args: [install, -g, typescript-language-server, typescript] }
        - { tool: brew, args: [install, typescript-language-server] }
    formatters:
      - command: prettier
        args: ["--stdin-filepath", "{file}"]
        stdin: true
        on: [save, manual]
        install: [{ tool: npm, args: [install, -g, prettier] }]
  javascript:
    extensions: [.js, .jsx, .mjs, .cjs]
    language_ids: { .jsx: javascriptreact }
    lsp:
      command: typescript-language-server
      args: [--stdio]
      root_markers: [jsconfig.json, package.json]
      install:
        - { tool: npm, args: [install, -g, typescript-language-server, typescript] }
    formatters:
      - command: prettier
        args: ["--stdin-filepath", "{file}"]
        stdin: true
        on: [save, manual]
        install: [{ tool: npm, args: [install, -g, prettier] }]
  python:
    extensions: [.py, .pyi]
    lsp:
      command: pyright-langserver
      args: [--stdio]
      root_markers: [pyproject.toml, setup.py, pyrightconfig.json]
      install:
        - { tool: npm, args: [install, -g, pyright] }
        - { tool: pip3, args: [install, --user, pyright] }
  rust:
    extensions: [.rs]
    lsp:
      command: rust-analyzer
      root_markers: [Cargo.toml]
      install:
        - { tool: rustup, args: [component, add, rust-analyzer] }
        - { tool: brew, args: [install, rust-analyzer] }
  yaml:
    extensions: [.yaml, .yml]
    lsp:
      command: yaml-language-server
      args: [--stdio]
      install: [{ tool: npm, args: [install, -g, yaml-language-server] }]
  json:
    extensions: [.json, .jsonc]
    lsp:
      command: vscode-json-language-server
      args: [--stdio]
      install: [{ tool: npm, args: [install, -g, vscode-langservers-extracted] }]
  bash:
    extensions: [.sh, .bash, .zsh]
    language_id: shellscript
    lsp:
      command: bash-language-server
      args: [start]
      install: [{ tool: npm, args: [install, -g, bash-language-server] }]
  css:
    extensions: [.css]
    lsp:
      command: vscode-css-language-server
      args: [--stdio]
      install: [{ tool: npm, args: [install, -g, vscode-langservers-extracted] }]
  html:
    extensions: [.html, .htm]
    lsp:
      command: vscode-html-language-server
      args: [--stdio]
      install: [{ tool: npm, args: [install, -g, vscode-langservers-extracted] }]
  markdown:
    extensions: [.md, .markdown]
  sql:
    extensions: [.sql]

terminal:
  shell: auto                 # auto = $SHELL, or pwsh on Windows
  font_size: 13

updates:
  channel: stable             # stable | prerelease | off

agent:
  default_provider: ""
  default_mode: auto
  providers: {}

modes:
  lazy:
    prompt: builtin:lazy
    tools: [read, grep, glob, ls, edit, multi_edit, lsp_diagnostics, run_tests, todo, ask_user]
    approval: { edit: auto, shell: ask }
  rubber-duck:
    prompt: builtin:rubber-duck
    tools: [read, grep, glob, ls, lsp_*, git_status, git_log, git_diff, web_search, web_fetch, todo, ask_user]
  auto:
    prompt: builtin:auto
    tools: all
    approval: { shell: ask, delete: ask, git_push: ask }
  fullstack:
    prompt: builtin:fullstack
    tools: all
    skills: [fullstack-go-shadcn-firebase-postgres]
    approval: { shell: ask, delete: ask }

tools:
  mcp: {}
  commands: {}
  skills:
    paths: [~/.config/hm/skills, .hm/skills]
  web:
    search: { provider: duckduckgo }   # duckduckgo | searxng | brave | tavily | exa
