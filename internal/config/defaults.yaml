# hm built-in defaults. Your ~/.config/hm/config.yaml and a project's
# .hm/config.yaml use the same keys; later files win. Maps merge key by key,
# lists replace.

editor:
  theme: tokyo-night          # any theme name, or "system"
  zoom: 1                     # whole-window zoom, 0.5 to 3; cmd+= / cmd+- / cmd+0
  font_size: 14
  font_family: ""             # empty = built-in monospace
  tab_width: 4
  insert_spaces: false
  soft_wrap: false
  line_numbers: true
  auto_indent: advanced       # none | keep | advanced
  trim_trailing_whitespace: false
  scroll_past_end: true       # let the last line scroll up to the top
  keymap: default             # default | vim
  format_on_save: true
  auto_save: off              # off | focus_change | delay
  auto_save_delay: 1s
  show_hidden: true           # show dotfiles in the explorer

keys:                         # command id -> chord; overrides built-ins
  palette: cmd+shift+p
  search.project: cmd+shift+f
  editor.find: cmd+f
  editor.replace: cmd+r
  file.quickOpen: cmd+p
  file.openFolder: cmd+o
  file.newFile: cmd+n
  file.save: cmd+s
  file.saveAll: cmd+alt+s
  file.close: cmd+w
  view.sidebar: cmd+b
  view.theme: cmd+k
  view.tabs: cmd+shift+e
  markdown.preview: cmd+shift+v
  panel.terminal: ctrl+`
  completion.trigger: alt+\
  terminal.new: ctrl+shift+`
  panel.git: cmd+shift+g
  panel.problems: cmd+shift+m
  agent.toggle: cmd+l
  agent.newTab: cmd+t         # while the agent shows; cmd+w closes its tab full screen
  agent.nextTab: ctrl+tab
  agent.prevTab: ctrl+shift+tab
  editor.definition: f12
  editor.references: shift+f12
  editor.rename: f2
  editor.format: shift+alt+f
  editor.symbols: cmd+shift+o
  editor.addNextOccurrence: cmd+d
  editor.selectAllOccurrences: cmd+alt+l   # cmd+shift+l asks the agent
  editor.addCursorAbove: cmd+alt+up
  editor.addCursorBelow: cmd+alt+down
  editor.toggleComment: cmd+/
  editor.duplicateLinesDown: shift+alt+down
  editor.duplicateLinesUp: shift+alt+up
  editor.moveLinesDown: alt+down
  editor.moveLinesUp: alt+up
  editor.deleteLines: cmd+shift+k
  agent.askSelection: cmd+shift+l
  app.settings: cmd+,
  view.zoomIn: cmd+=
  view.zoomOut: cmd+-
  view.zoomReset: cmd+0
  nav.back: ctrl+-
  view.splitRight: cmd+\
  view.focusNextGroup: cmd+alt+right
  nav.forward: ctrl+shift+-
  nav.backMouse: mouse4
  nav.forwardMouse: mouse5

# Shortcuts that apply in a context, VS Code style. A key is one chord or
# two in a row ("cmd+k cmd+s"); mouse3/4/5 are the middle and back/forward
# buttons. when tests: editorFocus, hasSelection, multiCursor, terminalFocus,
# agentFocus, agentView, panelOpen, searchOpen, gitTab, settingsTab, and
# vimNormal/vimInsert/vimVisual, with !, &&, || and parentheses. A command
# of "-id" removes id's shortcut from keys.
keybindings:
  - { key: cmd+shift+=, command: view.zoomIn }   # cmd++ on US layouts
#  - { key: "cmd+k cmd+s", command: file.saveAll }
#  - { key: "ctrl+r", command: agent.toggle, when: "!terminalFocus" }

search:
  engine: auto                # auto | ripgrep | builtin
  exclude: [node_modules, vendor, .git, dist]
  max_results: 5000

languages:
  # Each language maps extensions to a grammar, a language server and
  # formatters. "on" picks when a formatter runs: save, manual, paste.
  # {file} is the file being formatted; stdin: true pipes the buffer in and
  # takes stdout back. With no formatters, the server's formatting is used.
  # editor overrides the editor section for that language's files: tab_width,
  # insert_spaces, auto_indent, soft_wrap, format_on_save and
  # trim_trailing_whitespace.
  go:
    extensions: [.go]
    lsp:
      command: gopls
      args: [serve]
      root_markers: [go.work, go.mod]
      install:
        - { tool: go, args: [install, golang.org/x/tools/gopls@latest] }
        - { tool: brew, args: [install, gopls] }
    formatters:
      - { command: gofmt, args: ["-w", "{file}"], on: [save, manual] }
  typescript:
    editor: { tab_width: 2, insert_spaces: true }
    extensions: [.ts, .tsx, .mts, .cts]
    language_ids: { .tsx: typescriptreact }
    lsp:
      command: typescript-language-server
      args: [--stdio]
      root_markers: [tsconfig.json, package.json]
      install:
        - { tool: npm, args: [install, -g, typescript-language-server, typescript] }
        - { tool: brew, args: [install, typescript-language-server] }
    formatters:
      - command: prettier
        args: ["--stdin-filepath", "{file}"]
        stdin: true
        on: [save, manual]
        install: [{ tool: npm, args: [install, -g, prettier] }]
  javascript:
    editor: { tab_width: 2, insert_spaces: true }
    extensions: [.js, .jsx, .mjs, .cjs]
    language_ids: { .jsx: javascriptreact }
    lsp:
      command: typescript-language-server
      args: [--stdio]
      root_markers: [jsconfig.json, package.json]
      install:
        - { tool: npm, args: [install, -g, typescript-language-server, typescript] }
    formatters:
      - command: prettier
        args: ["--stdin-filepath", "{file}"]
        stdin: true
        on: [save, manual]
        install: [{ tool: npm, args: [install, -g, prettier] }]
  python:
    editor: { tab_width: 4, insert_spaces: true }
    extensions: [.py, .pyi]
    lsp:
      command: pyright-langserver
      args: [--stdio]
      root_markers: [pyproject.toml, setup.py, pyrightconfig.json]
      install:
        - { tool: npm, args: [install, -g, pyright] }
        - { tool: pip3, args: [install, --user, pyright] }
    formatters:
      - command: ruff
        args: [format, "{file}"]
        on: [save, manual]
        install:
          - { tool: brew, args: [install, ruff] }
          - { tool: pip3, args: [install, --user, ruff] }
  rust:
    editor: { tab_width: 4, insert_spaces: true }
    extensions: [.rs]
    lsp:
      command: rust-analyzer
      root_markers: [Cargo.toml]
      install:
        - { tool: rustup, args: [component, add, rust-analyzer] }
        - { tool: brew, args: [install, rust-analyzer] }
    formatters:
      - command: rustfmt
        args: [--edition, "2021", "{file}"]
        on: [save, manual]
        install: [{ tool: rustup, args: [component, add, rustfmt] }]
  java:
    editor: { tab_width: 4, insert_spaces: true }
    extensions: [.java]
    lsp:
      command: jdtls
      root_markers: [pom.xml, build.gradle, build.gradle.kts, settings.gradle]
      install: [{ tool: brew, args: [install, jdtls] }]
    formatters:
      - command: google-java-format
        args: [--replace, "{file}"]
        on: [manual]
        install: [{ tool: brew, args: [install, google-java-format] }]
  c:
    extensions: [.c, .h]
    lsp:
      command: clangd
      root_markers: [compile_commands.json, compile_flags.txt, .clangd, CMakeLists.txt]
      install: [{ tool: brew, args: [install, llvm] }]
    formatters:
      - command: clang-format
        args: [-i, "{file}"]
        on: [manual]
        install: [{ tool: brew, args: [install, clang-format] }]
  cpp:
    extensions: [.cc, .cpp, .cxx, .c++, .hh, .hpp, .hxx, .h++, .ipp]
    lsp:
      command: clangd
      root_markers: [compile_commands.json, compile_flags.txt, .clangd, CMakeLists.txt]
      install: [{ tool: brew, args: [install, llvm] }]
    formatters:
      - command: clang-format
        args: [-i, "{file}"]
        on: [manual]
        install: [{ tool: brew, args: [install, clang-format] }]
  csharp:
    editor: { tab_width: 4, insert_spaces: true }
    extensions: [.cs]
    lsp:
      command: csharp-ls
      root_markers: [global.json, Directory.Build.props, .git]
      install: [{ tool: dotnet, args: [tool, install, --global, csharp-ls] }]
  zig:
    editor: { tab_width: 4, insert_spaces: true }
    extensions: [.zig, .zon]
    lsp:
      command: zls
      root_markers: [build.zig]
      install: [{ tool: brew, args: [install, zls] }]
    formatters:
      - command: zig
        args: [fmt, --stdin]
        stdin: true
        on: [save, manual]
        install: [{ tool: brew, args: [install, zig] }]
  lua:
    editor: { tab_width: 2, insert_spaces: true }
    extensions: [.lua]
    lsp:
      command: lua-language-server
      root_markers: [.luarc.json, .stylua.toml, stylua.toml]
      install: [{ tool: brew, args: [install, lua-language-server] }]
    formatters:
      - command: stylua
        args: ["{file}"]
        on: [manual]
        install:
          - { tool: brew, args: [install, stylua] }
          - { tool: cargo, args: [install, stylua] }
  ruby:
    editor: { tab_width: 2, insert_spaces: true }
    extensions: [.rb, .rake, .gemspec, .ru]
    filenames: [Gemfile, Rakefile, Podfile, Vagrantfile]
    lsp:
      command: ruby-lsp
      root_markers: [Gemfile]
      install: [{ tool: gem, args: [install, ruby-lsp] }]
  php:
    editor: { tab_width: 4, insert_spaces: true }
    extensions: [.php]
    lsp:
      command: intelephense
      args: [--stdio]
      root_markers: [composer.json]
      install: [{ tool: npm, args: [install, -g, intelephense] }]
  proto:
    editor: { tab_width: 2, insert_spaces: true }
    extensions: [.proto]
    lsp:
      command: protols
      root_markers: [buf.yaml, buf.work.yaml]
      install: [{ tool: cargo, args: [install, protols] }]
    formatters:
      - command: buf
        args: [format, -w, "{file}"]
        on: [save, manual]
        install: [{ tool: brew, args: [install, bufbuild/buf/buf] }]
  yaml:
    editor: { tab_width: 2, insert_spaces: true }
    extensions: [.yaml, .yml]
    lsp:
      command: yaml-language-server
      args: [--stdio]
      install: [{ tool: npm, args: [install, -g, yaml-language-server] }]
  toml:
    editor: { tab_width: 4, insert_spaces: true }
    extensions: [.toml]
    filenames: [Cargo.lock, Pipfile, poetry.lock, uv.lock]
    lsp:
      command: taplo
      args: [lsp, stdio]
      install:
        - { tool: brew, args: [install, taplo] }
        - { tool: cargo, args: [install, taplo-cli, --locked, --features, lsp] }
    formatters:
      - command: taplo
        args: [fmt, "{file}"]
        on: [manual]
        install: [{ tool: brew, args: [install, taplo] }]
  json:
    editor: { tab_width: 2, insert_spaces: true }
    extensions: [.json, .jsonc]
    lsp:
      command: vscode-json-language-server
      args: [--stdio]
      install: [{ tool: npm, args: [install, -g, vscode-langservers-extracted] }]
  bash:
    extensions: [.sh, .bash, .zsh]
    language_id: shellscript
    lsp:
      command: bash-language-server
      args: [start]
      install: [{ tool: npm, args: [install, -g, bash-language-server] }]
  make:
    extensions: [.mk, .mak]
    filenames: [Makefile, makefile, GNUmakefile]
    language_id: makefile
    lsp:
      command: make-ls
      install: [{ tool: go, args: [install, github.com/owenrumney/make-ls/cmd/make-ls@latest] }]
    formatters:
      - command: mbake
        args: [format, --stdin]
        stdin: true
        on: [manual]
        install:
          - { tool: uv, args: [tool, install, mbake] }
          - { tool: pip3, args: [install, --user, mbake] }
  dockerfile:
    extensions: [.dockerfile]
    filenames: [Dockerfile, Containerfile]
    lsp:
      command: docker-langserver
      args: [--stdio]
      install: [{ tool: npm, args: [install, -g, dockerfile-language-server-nodejs] }]
  gomod:
    filenames: [go.mod, go.work]
  gitignore:
    filenames: [.gitignore, .dockerignore, .npmignore, .prettierignore, .eslintignore,
      .ignore, .rgignore, .fdignore, .helmignore]
  dotenv:
    extensions: [.env]
    filenames: [.env.local, .env.example, .env.development, .env.production, .env.test]
  ini:
    extensions: [.ini, .cfg]
    filenames: [.editorconfig, .gitconfig, .gitmodules, .npmrc]
  diff:
    extensions: [.diff, .patch]
  css:
    editor: { tab_width: 2, insert_spaces: true }
    extensions: [.css]
    lsp:
      command: vscode-css-language-server
      args: [--stdio]
      install: [{ tool: npm, args: [install, -g, vscode-langservers-extracted] }]
  html:
    editor: { tab_width: 2, insert_spaces: true }
    extensions: [.html, .htm]
    lsp:
      command: vscode-html-language-server
      args: [--stdio]
      install: [{ tool: npm, args: [install, -g, vscode-langservers-extracted] }]
  markdown:
    extensions: [.md, .markdown]
  sql:
    extensions: [.sql]

terminal:
  shell: auto                 # auto = $SHELL, or pwsh on Windows
  font_size: 13

updates:
  channel: stable             # stable | prerelease | off
  repo: mirzakhany/hm         # GitHub repository releases come from

agent:
  default_provider: anthropic
  default_mode: auto
  layout: fullscreen          # fullscreen (toggles with the editor) | panel (beside it)
  # Keys live in the OS keychain: "keychain:<name>" (Settings → Agent → Add key)
  # or an environment variable: "${OPENAI_API_KEY}". Pick the model in
  # Settings → Agent once a key is set.
  providers:
    anthropic: { type: anthropic, api_key: "keychain:anthropic", model: claude-opus-5-5, effort: high }
    # Any OpenAI-compatible endpoint: OpenAI, OpenRouter
    # (https://openrouter.ai/api/v1), Ollama (http://localhost:11434/v1), ...
    openai: { type: openai, base_url: "https://api.openai.com/v1", api_key: "keychain:openai" }
  # The task tool lets the agent hand work to sub-agents, which run in
  # sessions of their own and report back.
  subagents:
    max_depth: 1              # how deep sub-agents nest; 0 turns the task tool off
    max_concurrent: 4         # sub-agents of one agent running at once

# Where the agent keeps artifacts. Storage backends are not wired up yet.
artifacts:
  storage: none               # none | gcs | s3 | git
  bucket: ""                  # gcs / s3 bucket
  prefix: ""                  # folder in the bucket
  repo: ""                    # git remote URL
  branch: main

# AI inline completions: ghost text at the caret, Tab accepts, Esc dismisses.
completion:
  enabled: true
  provider: ""                # a name under agent.providers; empty = agent.default_provider
  model: ""                   # a small, fast model; empty = off
  delay: 300ms                # pause in typing before asking
  max_tokens: 256

modes:
  lazy:
    prompt: builtin:lazy
    tools: [read, grep, glob, ls, edit, multi_edit, lsp_diagnostics, run_tests, todo, ask_user]
    approval: { edit: auto, shell: ask }
  rubber-duck:
    prompt: builtin:rubber-duck
    tools: [read, grep, glob, ls, lsp_*, git_status, git_log, git_diff, web_search, web_fetch, todo, ask_user]
  auto:
    prompt: builtin:auto
    tools: all
    approval: { shell: ask, delete: ask, git_push: ask }
  fullstack:
    prompt: builtin:fullstack
    tools: all
    skills: [fullstack-go-shadcn-firebase-postgres]
    approval: { shell: ask, delete: ask }

tools:
  mcp: {}
  commands: {}
  skills:
    paths: [~/.config/hm/skills, .hm/skills, .cursor/skills, .claude/skills]
  web:
    search: { provider: duckduckgo }   # duckduckgo | searxng | brave | tavily | exa
