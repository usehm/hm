# Regenerate internal/db/sqlc after editing queries or migrations:
#   go run github.com/sqlc-dev/sqlc/cmd/sqlc@latest generate
version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
