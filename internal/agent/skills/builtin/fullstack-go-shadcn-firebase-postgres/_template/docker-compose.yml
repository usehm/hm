services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: __APP__
      POSTGRES_PASSWORD: __APP__
      POSTGRES_DB: __APP__
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U __APP__"]
      interval: 2s
      retries: 20
volumes:
  pgdata:
